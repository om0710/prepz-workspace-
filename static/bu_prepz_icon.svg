<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181b26"/>
      <stop offset="100%" stop-color="#0a0c12"/>
    </linearGradient>
    
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff9100"/>
      <stop offset="50%" stop-color="#ff5722"/>
      <stop offset="100%" stop-color="#e64a19"/>
    </linearGradient>

    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe082"/>
      <stop offset="50%" stop-color="#ffb300"/>
      <stop offset="100%" stop-color="#ff8f00"/>
    </linearGradient>
  </defs>

  <!-- Base Rounded Background Container -->
  <rect x="16" y="16" width="480" height="480" rx="104" fill="url(#bgGrad)" stroke="#ff5722" stroke-width="6" stroke-opacity="0.4"/>
  <rect x="30" y="30" width="452" height="452" rx="90" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.06"/>

  <!-- Subtle Radial Glow Behind Centerpiece -->
  <circle cx="256" cy="256" r="160" fill="#ff5722" opacity="0.12"/>

  <!-- Center Artwork: Cyber Open Book + Spark of Mastery -->
  <g transform="translate(256, 256) scale(1.3) translate(-128, -128)">
    <!-- Left Wing of Book -->
    <path d="M44 196 C 72 172, 102 168, 122 170 L 122 66 C 102 64, 72 68, 44 92 Z" 
          fill="url(#orangeGrad)" opacity="0.95"/>
    
    <!-- Right Wing of Book -->
    <path d="M212 196 C 184 172, 154 168, 134 170 L 134 66 C 154 64, 184 68, 212 92 Z" 
          fill="url(#orangeGrad)" opacity="0.85"/>
          
    <!-- Central Spine Divider -->
    <path d="M128 64 L 128 174" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round" opacity="0.9"/>

    <!-- Electric Knowledge Lightning Spark -->
    <polygon points="138,40 96,122 126,122 116,194 168,102 136,102" 
             fill="url(#goldGrad)" 
             stroke="#ffffff" 
             stroke-width="3.5"
             stroke-linejoin="round"/>
  </g>
</svg>
